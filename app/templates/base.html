<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>员工信息管理系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <nav>
        <a href="{{ url_for('dashboard') }}">仪表板</a>
        {% if session.user_id %}
        <a href="{{ url_for('profile', user_id=session.user_id) }}">我的资料</a>
        <a href="{{ url_for('edit_profile', user_id=session.user_id) }}">编辑资料</a>
        <a href="{{ url_for('logout') }}">退出登录</a>
        {% endif %}
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>

</html>
