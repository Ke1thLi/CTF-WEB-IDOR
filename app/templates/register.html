{% extends "base.html" %}
{% block content %}
<h2>用户注册</h2>
<form method="POST">
    <input type="text" name="username" placeholder="用户名" required><br>
    <input type="password" name="password" placeholder="密码" required><br>
    <input type="text" name="full_name" placeholder="姓名"><br>
    <input type="email" name="email" placeholder="电子邮箱"><br>
    <input type="text" name="department" placeholder="部门"><br>
    <input type="submit" value="注册">
</form>
<p>已有账号？<a href="{{ url_for('login') }}">去登录</a></p>
{% endblock %}
